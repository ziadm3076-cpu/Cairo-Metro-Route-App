<title>Cairo Metro Route</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a station-sign header over one column. The route is drawn as a vertical metro diagram, one coloured segment per line. */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --field: #F4F6F8;
  --ink: #101B26;
  --muted: #556575;
  --rule: #D3DAE1;
  --hl: #E4ECF4;
  --sign-bg: #0F2236;
  --sign-fg: #F2F6F9;
  --l1: #1459A8;
  --l2: #C4122F;
  --l3: #0A7F5E;
  --on-line: #FFFFFF;
  --focus: #2B6FD6;
  --font-ui: "Cairo", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1318; --surface: #16202A; --field: #0F171E; --ink: #E9EFF4; --muted: #9AABBA;
    --rule: #2A3946; --hl: #223243; --sign-bg: #091017; --sign-fg: #F2F6F9;
    --l1: #5B9CEB; --l2: #F2586F; --l3: #2EC79B; --on-line: #0D1318; --focus: #8DB8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1318; --surface: #16202A; --field: #0F171E; --ink: #E9EFF4; --muted: #9AABBA;
  --rule: #2A3946; --hl: #223243; --sign-bg: #091017; --sign-fg: #F2F6F9;
  --l1: #5B9CEB; --l2: #F2586F; --l3: #2EC79B; --on-line: #0D1318; --focus: #8DB8FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--font-ui);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--sign-bg);
  z-index: 10;
}
[data-line="1"] { --lc: var(--l1); }
[data-line="2"] { --lc: var(--l2); }
[data-line="3"] { --lc: var(--l3); }

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sign-bar { background: var(--sign-bg); color: var(--sign-fg); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 14px; padding-block: 18px; direction: ltr; }
.mark { display: block; width: 46px; height: auto; aspect-ratio: 1; flex: none; }
h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.brand .sub { margin: 2px 0 0; font-size: 15px; opacity: 0.75; }
main.wrap { display: flex; flex-direction: column; gap: 20px; padding-block: 20px 36px; }

.planner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: 16px;
}
.fields { display: grid; gap: 14px; min-width: 0; }
.field label {
  display: flex; gap: 8px; align-items: baseline;
  margin-bottom: 4px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);
}
.combo { position: relative; }
.combo input {
  width: 100%; height: 48px; padding: 0 14px;
  font: 600 17px var(--font-ui);
  color: var(--ink); background: var(--field);
  border: 1.5px solid var(--rule); border-radius: 10px;
}
.combo input::placeholder { color: var(--muted); font-weight: 400; }
.combo input:focus-visible, .swap:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.combo ul {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px);
  margin: 0; padding: 6px; list-style: none;
  max-height: min(320px, 50vh); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(8, 18, 28, 0.2);
}
.combo li {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 10px; border-radius: 8px; cursor: pointer;
}
.combo li.on { background: var(--hl); }
.combo li .s { color: var(--muted); font-size: 15px; }
.combo li.none { display: block; cursor: default; color: var(--muted); }
@media (hover: hover) { .combo li[data-id]:hover { background: var(--hl); } }
.combo ul { padding: 0 6px 6px; }
.combo li.grp { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 1; padding: 12px 10px 8px; background: var(--surface); border-bottom: 1px solid var(--rule); border-radius: 0; cursor: default; color: var(--lc); font-weight: 800; }
.combo li.grp .gb { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--lc); color: var(--on-line); font: 500 13px var(--font-mono); }
.combo li.grp .ga { margin-inline-start: auto; font-weight: 600; color: var(--muted); font-size: 14px; }
.combo li.grp .gt, .combo li.grp .ga { white-space: nowrap; }
.combo li.grp.soon { position: static; flex-wrap: wrap; row-gap: 4px; border-bottom: 0; color: var(--muted); }
.combo li.grp .tag { flex-basis: 100%; margin: 0; margin-inline-start: 34px; }
.combo li[data-id] { grid-template-columns: 30px minmax(0, 1fr) auto; scroll-margin-top: 48px; }
.combo li .num { font: 500 13px var(--font-mono); color: var(--lc); font-variant-numeric: tabular-nums; }
.combo li .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; min-width: 0; }
[data-line="4"] { --lc: var(--muted); }
.dots { display: inline-flex; gap: 4px; min-width: 24px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lc); }
.swap {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink);
}
.swap:hover { background: var(--hl); }

.summary h2 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800; text-wrap: balance; }
.summary .to { font-weight: 400; color: var(--muted); }
.summary .s { margin: 4px 0 0; color: var(--muted); font-size: 16px; }
.meta {
  margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px;
  font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted);
}
.meta b { color: var(--ink); font-weight: 500; }
.meta .fare { display: inline-flex; align-items: center; gap: 8px; }
.tk { width: 40px; height: 18px; border-radius: 3px; border: 1px solid var(--rule); object-fit: cover; flex: none; }
.route { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

.leg { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.sign { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--lc); color: var(--on-line); }
.badge {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--on-line); color: var(--lc); font: 500 20px var(--font-mono);
}
.sign-text { flex: 1; min-width: 0; }
.kicker { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.towards { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.tw { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.tw .p { font-size: 20px; font-weight: 800; line-height: 1.3; }
.tw .s { font-size: 16px; }
.or { font-size: 13px; }
.count { flex: none; font: 500 13px var(--font-mono); padding: 3px 10px; border: 1.5px solid currentColor; border-radius: 999px; }

.stops { list-style: none; margin: 0; padding: 8px 16px 10px; }
.stop {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 42px; padding-block: 9px; padding-inline: 36px 0;
}
.stop::before { content: ""; position: absolute; inset-inline-start: 11px; width: 4px; top: 0; bottom: 0; background: var(--lc); }
.stop.is-board::before { top: 50%; }
.stop.is-exit::before { bottom: 50%; }
.stop::after {
  content: ""; position: absolute; inset-inline-start: 6px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--surface); border: 3px solid var(--lc);
}
.stop.is-board::after, .stop.is-exit::after { inset-inline-start: 2px; width: 22px; height: 22px; margin-top: -11px; border-width: 5px; }
.names { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; min-width: 0; }
.stop .p { font-size: 16px; font-weight: 600; }
.stop .s { font-size: 15px; color: var(--muted); }
.stop.is-mid .p { font-weight: 400; }
.is-board .p, .is-exit .p { font-size: 17px; font-weight: 800; }
.tag { flex: none; font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.change {
  margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px;
  padding: 12px 16px; border-radius: 12px; background: var(--hl); font-size: 15px;
}
.change .lead, .change .p { font-weight: 700; }
.change .s { color: var(--muted); font-size: 14px; }
.change .sub { flex-basis: 100%; color: var(--muted); font-size: 14px; }
.hint { margin: 0; padding: 16px; border: 1px dashed var(--rule); border-radius: 12px; color: var(--muted); }
.foot { margin: 0; font-size: 13px; color: var(--muted); text-wrap: pretty; }

.lang {
  margin-inline-start: auto; margin-left: auto; flex: none; height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid rgba(242, 246, 249, 0.4); background: transparent; color: var(--sign-fg); font: 700 15px var(--font-ui);
}
.lang:hover { background: rgba(242, 246, 249, 0.12); }
.lang:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
/* Arabic mode: right to left, no letter spacing (it breaks Arabic joins), Arabic digits in the UI face. */
html[lang="ar"] .titles { direction: rtl; text-align: right; }
html[lang="ar"] body { line-height: 1.65; }
[lang="ar"], html[lang="ar"] h1, html[lang="ar"] .field label, html[lang="ar"] .kicker, html[lang="ar"] .tag { letter-spacing: 0; text-transform: none; }
html[lang="ar"] .meta, html[lang="ar"] .count, html[lang="ar"] .badge, html[lang="ar"] .num, html[lang="ar"] .gb, html[lang="ar"] .tag, html[lang="ar"] .splash-word { font-family: var(--font-ui); }
html[lang="ar"] .meta b, html[lang="ar"] .count { font-weight: 600; }

/* Opening sequence: the mark fades in, holds, then glides into the header while the page settles in. */
.splash { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
.splash-bg { position: absolute; inset: 0; background: var(--sign-bg); }
.splash-stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.splash-mark { display: block; width: min(56vw, 250px); height: auto; aspect-ratio: 1; }
.splash-word { margin: 0; color: var(--sign-fg); font: 800 22px/1.2 var(--font-ui); letter-spacing: 0.01em; }
.titles, .lang, .planner, #result, .foot {
  transition: opacity 0.7s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.planner { transition-delay: 0.1s; }
#result { transition-delay: 0.2s; }
.foot { transition-delay: 0.3s; }
.intro .titles, .intro .lang { opacity: 0; transform: translateX(-12px); }
.intro .planner, .intro #result, .intro .foot { opacity: 0; transform: translateY(14px); }
.intro .brand .mark { visibility: hidden; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.leg, .change { animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 80ms); }
@media (prefers-reduced-motion: reduce) {
  .leg, .change { animation: none; }
  .titles, .lang, .planner, #result, .foot { transition: none; }
}
</style>

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')

    st.kAr = norm(st.ar);

    st.kAlias = norm(st.alias);
    st.compact = st.kEn.replace(/ /g, '');
    return st;

      '</span><span class="gt">' + t.line(no) + '</span>' + span('ga', o.line(no), other()) +
      (soon ? '<span class="tag">' + t.soon + '</span>' : '') + '</li>';
  }

  function createCombo(name) {
    const input = $(name + '-input'), list = $(name + '-list');
    let selected = null, results = [], active = -1, timer = 0, typed = false, query = '';

    function build(q) {
      const hit = q ? new Set(search(q)) : null;
      const out = [];
      GROUPS.forEach(function (g) {
        g.ids.forEach(function (id, i) {
          if (!hit || hit.has(id)) out.push({ id: id, no: g.no, n: i + 1 });
        });
      });
      return out;
    }
    function otherDots(id, no) {
      return linesOf(id).filter(function (n) { return n !== no; })
        .map(function (n) { return '<i class="dot" data-line="' + n + '"></i>'; }).join('');
    }
    function paint() {
      if (!results.length) {
        list.innerHTML = '<li class="none" role="presentation">' + T().none + '</li>';
        return;
      }
      let html = '', last = 0;
      results.forEach(function (r, i) {
        if (r.no !== last) { last = r.no; html += groupHead(r.no, false); }
        html += '<li role="option" id="' + name + '-o' + i + '" data-id="' + r.id + '" data-line="' + r.no + '" aria-selected="' + (i === active) + '"' +
          (i === active ? ' class="on"' : '') + '><span class="num">' + fmt(r.n) + '</span><span class="nm">' + pairHtml(r.id) +
          '</span><span class="dots">' + otherDots(r.id, r.no) + '</span></li>';
      });
      if (!query) html += groupHead(4, true);
      list.innerHTML = html;
    }
    function highlight(i, scroll) {
      const items = list.querySelectorAll('li[data-id]');
      if (active >= 0 && items[active]) { items[active].classList.remove('on'); items[active].setAttribute('aria-selected', 'false'); }
      active = i;
      if (active >= 0 && items[active]) {
        items[active].classList.add('on');
        items[active].setAttribute('aria-selected', 'true');
        input.setAttribute('aria-activedescendant', items[active].id);
        if (scroll) items[active].scrollIntoView({ block: 'nearest' });
      }
    }
    function openList(q) {
      query = q ? q.trim() : '';
      results = build(query);
      active = results.length ? 0 : -1;
      if (!query && selected) {
        const k = results.findIndex(function (r) { return r.id === selected; });
        if (k >= 0) active = k;
      }
      paint();
      list.hidden = false;
      input.setAttribute('aria-expanded', 'true');
      if (active >= 0) {
        input.setAttribute('aria-activedescendant', name + '-o' + active);
        const el = list.querySelector('li.on');
        if (el && !query) list.scrollTop = Math.max(0, el.offsetTop - 120);
      }
    }
    function closeList() {
      list.hidden = true;
      input.setAttribute('aria-expanded', 'false');
      input.removeAttribute('aria-activedescendant');
    }
    function restore() { input.value = selected ? nameP(selected) : ''; typed = false; }
    function pick(id) {
      selected = id; input.value = nameP(id); typed = false;
      closeList();
      state[name] = id;
      input.blur();
      update();
    }
    function set(id) { selected = id; input.value = id ? nameP(id) : ''; }
    function uniqueId() {
      const ids = {};
      results.forEach(function (r) { ids[r.id] = 1; });
      const keys = Object.keys(ids);
      return keys.length === 1 ? keys[0] : null;
    }

    input.addEventListener('focus', function () { clearTimeout(timer); typed = false; input.select(); openList(''); });
    input.addEventListener('input', function () { typed = true; openList(input.value); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (list.hidden) openList(typed ? input.value : '');
        else if (results.length) highlight(Math.min(active + 1, results.length - 1), true);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!list.hidden && results.length) highlight(Math.max(active - 1, 0), true);
      } else if (e.key === 'Enter') {
        if (!list.hidden && active >= 0) { e.preventDefault(); pick(results[active].id); }
      } else if (e.key === 'Escape') {
        closeList(); restore();
      }
    });
    input.addEventListener('blur', function () {
      timer = setTimeout(function () {
        const only = typed ? uniqueId() : null;
        if (only) pick(only);
        else { closeList(); restore(); }
      }, 150);
    });
    list.addEventListener('mousedown', function (e) { e.preventDefault(); });
    list.addEventListener('click', function (e) {
      const li = e.target.closest('li[data-id]');
      if (li) pick(li.getAttribute('data-id'));
    });
    return { set: set };
  }

  const combos = { from: createCombo('from'), to: createCombo('to') };

  function towardsHtml(ids) {
    return ids.map(function (id) { return '<span class="tw">' + pairHtml(id) + '</span>'; })
      .join('<span class="or">' + T().or + '</span>');
  }
  function legHtml(leg, i) {
    const t = T(), last = leg.stations.length - 1;
    const rows = leg.stations.map(function (id, k) {
      const role = k === 0 ? 'board' : (k === last ? 'exit' : 'mid');
      const tag = k === 0 ? t.getOn : (k === last ? t.getOff : '');
      return '<li class="stop is-' + role + '"><span class="names">' + pairHtml(id) + '</span>' +
        (tag ? '<span class="tag">' + tag + '</span>' : '') + '</li>';
    }).join('');
    return '<section class="leg" data-line="' + leg.no + '" style="--i:' + (2 * i) + '"><header class="sign"><span class="badge" aria-hidden="true">' + fmt(leg.no) +
      '</span><div class="sign-text"><span class="kicker">' + t.take(leg.no) + '</span><div class="towards">' +
      towardsHtml(leg.toward) + '</div></div><span class="count">' + t.stops(leg.stops) +
      '</span></header><ol class="stops">' + rows + '</ol></section>';
  }
  function changeHtml(prev, next, i) {
    const t = T();
    const id = prev.stations[prev.stations.length - 1];
    const same = prev.no === next.no;
    const sub = same ? t.splits(nameP(next.toward[0])) : t.follow(next.no);
    return '<p class="change" style="--i:' + (2 * i - 1) + '"><span class="lead">' + (same ? t.changeTrains : t.changeAt) + '</span>' +
      pairHtml(id) + '<span class="sub">' + sub + '</span></p>';
  }

  function update() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    const t = T(), out = $('result');
    if (!state.from && !state.to) { out.innerHTML = '<p class="hint">' + t.h0 + '</p>'; return; }
    if (!state.from) { out.innerHTML = '<p class="hint">' + t.hFrom + '</p>'; return; }
    if (!state.to) { out.innerHTML = '<p class="hint">' + t.hTo + '</p>'; return; }
    if (state.from === state.to) { out.innerHTML = '<p class="hint">' + t.same + '</p>'; return; }
    const p = plan(state.from, state.to);
    if (!p) { out.innerHTML = '<p class="hint">' + t.noRoute + '</p>'; return; }
    const o = other(), ot = TEXT[o];
    const range = p.minLow === p.minutes ? fmt(p.minutes) : fmt(p.minLow) + '–' + fmt(p.minutes);
    const body = p.legs.map(function (leg, i) { return (i ? changeHtml(p.legs[i - 1], leg, i) : '') + legHtml(leg, i); }).join('');
    const names = function (l, id) { return l === 'ar' ? S[id].ar : S[id].en; };
    out.innerHTML = '<div class="summary"><h2>' + names(lang, state.from) + ' <span class="to">' + t.toWord + '</span> ' + names(lang, state.to) + '</h2>' +
      '<p class="s" lang="' + o + '" dir="' + dirOf(o) + '">' + names(o, state.from) + ' ' + ot.toWord + ' ' + names(o, state.to) + '</p>' +
      '<p class="meta"><span><b>' + t.stops(p.stops) + '</b></span><span>' + t.changes(p.changes) + '</span><span>' + t.about(range) +
      '</span><span class="fare"><img class="tk" alt="" src="' + ticketImg(p.fare) + '">' + t.fare(p.fare) + '</span></p></div><div class="route">' + body + '</div>';
  }

  function applyLanguage() {
    const t = T(), root = document.documentElement;
    root.lang = lang; root.dir = dirOf(lang);
    document.title = t.title;
    $('t-title').textContent = t.title;
    const sub = $('t-sub'); sub.textContent = t.sub; sub.lang = t.subLang; sub.dir = dirOf(t.subLang);
    $('t-from').textContent = t.from; $('t-to').textContent = t.to;
    $('from-input').placeholder = t.ph; $('to-input').placeholder = t.ph;
    $('from-list').setAttribute('aria-label', t.fromList); $('to-list').setAttribute('aria-label', t.toList);
    $('swap').setAttribute('aria-label', t.swap);
    $('t-foot').textContent = t.foot;
    const b = $('lang'); b.textContent = t.langBtn; b.lang = t.langBtnLang; b.setAttribute('aria-label', t.langAria);
    combos.from.set(state.from); combos.to.set(state.to);
    update();
  }

  $('planner').addEventListener('submit', function (e) { e.preventDefault(); });
  $('swap').addEventListener('click', function () {
    const t = state.from; state.from = state.to; state.to = t;
    combos.from.set(state.from); combos.to.set(state.to);
    update();
  });

  $('lang').addEventListener('click', function () {
    lang = other();
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
    applyLanguage();
  });

  applyLanguage();
})();

(function intro() {
  'use strict';
  const root = document.documentElement;
  const src = document.querySelector('.brand .mark');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !src || !src.animate) return;

  root.classList.add('intro');
  const veil = document.createElement('div');
  veil.className = 'splash';
  veil.setAttribute('aria-hidden', 'true');
  const bg = document.createElement('div');
  bg.className = 'splash-bg';
  const stack = document.createElement('div');
  stack.className = 'splash-stack';
  const mark = src.cloneNode(true);
  mark.classList.remove('mark');
  mark.classList.add('splash-mark');
  const word = document.createElement('p');
  word.className = 'splash-word';
  word.textContent = document.getElementById('t-title').textContent;
  stack.appendChild(mark);
  stack.appendChild(word);
  veil.appendChild(bg);
  veil.appendChild(stack);
  document.body.appendChild(veil);

  let finished = false;
  function finish() {
    if (finished) return;
    finished = true;
    root.classList.remove('intro');
    requestAnimationFrame(function () { veil.remove(); });
  }

  const ease = 'cubic-bezier(0.65, 0, 0.2, 1)';
  const soft = 'cubic-bezier(0.2, 0.7, 0.2, 1)';
  mark.animate(
    [{ opacity: 0, transform: 'scale(0.86)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: 1800, easing: soft, fill: 'both' }
  );
  word.animate(
    [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }],
    { duration: 1200, delay: 500, easing: soft, fill: 'both' }
  );

  setTimeout(function () {
    try {
      const r = mark.getBoundingClientRect();
      const t = src.getBoundingClientRect();
      const dx = t.left - r.left, dy = t.top - r.top, s = t.width / r.width;
      veil.style.pointerEvents = 'none';
      mark.getAnimations().forEach(function (a) { a.cancel(); });
      word.getAnimations().forEach(function (a) { a.cancel(); });
      mark.style.transformOrigin = '0 0';
      word.animate(
        [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(12px)' }],
        { duration: 400, easing: 'ease-in', fill: 'forwards' }
      );
      bg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, delay: 150, easing: 'ease-in-out', fill: 'forwards' });
      const move = mark.animate(
        [{ transform: 'translate(0, 0) scale(1)' }, { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + s + ')' }],
        { duration: 1100, easing: ease, fill: 'forwards' }
      );
      move.onfinish = finish;
    } catch (e) { finish(); }
  }, 2000);

  setTimeout(finish, 6000);
})();
</script>
